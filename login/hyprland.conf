# Hyprland SÓ da tela de login (doc 34). Roda como o usuário "greeter", não como você.
monitor=HDMI-A-1,2560x1440@144.00,0x0,1
monitor=eDP-1,preferred,auto,1.6,mirror,HDMI-A-1
monitor=,preferred,auto,1
input {
    kb_layout = br,us
    kb_variant = abnt2,
    numlock_by_default = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
animations {
    enabled = true
    animation = global, 1, 3, default
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
# A MESMA escolha de GPU do seu hyprland.conf (notebook híbrido): a integrada AMD primeiro. Sem isto o
# Hyprland do login podia subir na NVIDIA e dar tela preta/sem saída (os apelidos vêm das regras udev).
env = AQ_DRM_DEVICES,/dev/dri/amd-igpu:/dev/dri/nvidia-dgpu
env = GSK_RENDERER,gl
# a tela de login; quando ela termina (você entrou), este Hyprland fecha e o greetd abre o seu
exec-once = python3 /etc/greetd/aero-login/aero-login.py; hyprctl dispatch exit
