# Trigger rules: both word groups must appear, so one word alone never fires.
# read|TOPIC[,TOPIC]|verbs|objects                 prints exact facts, without the model
# report|TOPIC[,TOPIC]|verbs|objects               prints and saves a report
# run|NAME|verbs|objects|command|description       asks first, then runs ({n} takes 0..100)
# group|@name|words                               a word family usable in any rule; word order is free for commands
# One-letter typos are corrected when only one known word is that close.
# Words are matched without accents. Portuguese words are input vocabulary.
