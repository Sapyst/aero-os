# Gerado pelo app Configurações (painel-energia). Edite pelo app.
[Login]
# Tampa fechada COM monitor externo
HandleLidSwitchDocked=ignore
# Tampa fechada SEM monitor externo (na bateria e na tomada)
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
# Botão de energia: um toque / segurar
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
# Nenhum programa pode bloquear o botão
PowerKeyIgnoreInhibited=yes
# Nunca dormir sozinho por inatividade
IdleAction=ignore
