# Aero OS — memória esperta, swap em RAM comprimida. Instalar em /etc/systemd/zram-generator.conf
# (system/memory/install.sh faz isso, guardando uma cópia do arquivo antigo).
# Precisa do pacote zram-generator. Vale no próximo boot, ou já, com o zram vazio:
#   sudo systemctl daemon-reload && sudo systemctl restart systemd-zram-setup@zram0
# Atenção: arquivos em /etc/systemd/zram-generator.conf.d/*.conf têm prioridade sobre este.
#
# zram = uma "swap" que fica dentro da própria RAM, comprimida (com zstd, memória de apps
# costuma ocupar ~1/3). É a primeira camada de swap; o swapfile do SSD (aero-swap-setup,
# prioridade 10) é a segunda e só recebe o que não couber aqui.

[zram0]
# Tamanho em MB a partir da RAM total ("ram", em MB): metade da RAM, no máximo 16 GB.
# É quanto cabe *antes* de comprimir; cheio, gasta ~1/3 disso de RAM de verdade.
# Ex.: 32 GB de RAM → ~16 GB de zram (~5 GB reais se lotar); 8 GB de RAM → 4 GB de zram.
zram-size = min(ram / 2, 16384)
# zstd: a melhor compressão por CPU gasta para swap de desktop (lz4 é mais rápido e comprime menos).
compression-algorithm = zstd
# Prioridade alta: o kernel enche o zram antes de tocar no SSD (prioridade 10).
swap-priority = 100
