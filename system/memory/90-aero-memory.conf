# Aero OS — memória esperta, parte do kernel. Instalar em /etc/sysctl.d/90-aero-memory.conf
# (system/memory/install.sh faz isso). Aplicar sem reiniciar: sudo sysctl --system
# Conferir: sysctl vm.swappiness vm.page-cluster vm.watermark_scale_factor vm.dirty_bytes
#
# Pensado para duas camadas de swap:
#   1. zram (RAM comprimida com zstd, prioridade 100) — rápida, usada primeiro;
#   2. swapfile no SSD (aero-swap-setup, prioridade 10) — só recebe o que sobra, páginas frias.
# Sem zram, vm.swappiness e vm.page-cluster daqui mandariam memória para o SSD: o install.sh
# --no-zram instala este arquivo sem essas duas (ficam no padrão do kernel). Sem --no-zram, se o
# zram não ligar, o install.sh não cria o swapfile do SSD.
# Os arquivos de /etc/sysctl.d e /usr/lib/sysctl.d são lidos em ordem alfabética: um arquivo de
# nome "maior" (ex.: 99-*.conf) que mude as mesmas chaves vence este. O install.sh avisa se isso
# acontecer.

# swappiness (0..200) = custo de ler da swap comparado a reler arquivos do disco.
# 100 = custos iguais; acima de 100 = swap mais barata. A doc do kernel: se a swap é N vezes mais
# rápida que o disco, swappiness = 200·N/(N+1). Com zram a "swap" é RAM: descomprimir 4 KB leva
# microssegundos, bem mais rápido que ler do NVMe. 150 = "swap 3x mais barata": o kernel prefere
# comprimir memória parada de apps e manter na RAM o cache de arquivos (programas, bibliotecas).
# Não usamos 180-200 porque, com o zram cheio, a sobra vai para o SSD, que custa o mesmo que
# reler arquivos. Vale também com o MGLRU (ele usa a swappiness para escolher anônima x arquivo).
# Padrão do kernel: 60.
vm.swappiness = 150

# page-cluster = quantas páginas ler da swap de uma vez (2^N). Padrão 3 = 8 páginas (readahead).
# No zram não existe "busca" de disco para economizar: ler 8 páginas = descomprimir 8, e quase
# sempre só uma era necessária — mais latência e RAM gasta. 0 = uma página por vez, a menor
# latência na hora em que o app volta a usar a memória. Vale para todas as swaps (não dá para
# escolher por dispositivo); o SSD só guarda páginas frias, onde a latência importa mais que o
# volume.
vm.page-cluster = 0

# Quando a memória fica fragmentada, o kernel "turbina" a liberação de memória (padrão 15000 =
# até 150% da marca alta) para facilitar huge pages. Na prática isso dá rajadas do kswapd que
# mandam páginas para a swap sem falta real de memória (engasgos). 0 desliga só esse turbo;
# a liberação normal (watermark_scale_factor, abaixo) continua.
vm.watermark_boost_factor = 0

# Distância entre as marcas de memória livre min/low/high, em frações de 10000 da RAM.
# Padrão 10 = 0,1% (~30 MB por degrau em 32 GB): o kswapd acorda tarde e os apps caem em
# "direct reclaim" (param esperando memória — o travamento que se sente). 125 = 1,25% (~400 MB
# por degrau em 32 GB, ~100 MB em 8 GB): o kswapd começa antes e comprime para o zram em
# segundo plano, sem travar ninguém. Custo: ~2,5% da RAM fica livre como folga. Máximo: 3000.
vm.watermark_scale_factor = 125

# Quão rápido o kernel descarta o cache de pastas e inodes (nomes e atributos de arquivos)
# comparado ao cache de páginas. 100 = justo (padrão); menos = guarda mais. 50 mantém rápido
# abrir pastas, buscar arquivos e abrir apps mesmo com a memória apertada. Nunca use 0 (nunca
# descarta e pode esgotar a memória). Kernels novos dividem este valor por
# vm.vfs_cache_pressure_denom (padrão 100): continua sendo "metade".
vm.vfs_cache_pressure = 50

# Quanto dado "sujo" (escrito pelos apps, ainda não gravado no disco) pode acumular na RAM.
# O padrão é por porcentagem: dirty_ratio=20 e dirty_background_ratio=10 da memória disponível.
# Em 32 GB isso é ~6 GB pendentes: copiar um arquivo grande para um pendrive ou disco NTFS enche
# a RAM de escrita pendente e depois tudo para, esperando o disco lento. Valores fixos em bytes
# se comportam igual com qualquer quantidade de RAM.
# DE PROPÓSITO: gravar vm.dirty_bytes zera vm.dirty_ratio, e vm.dirty_background_bytes zera
# vm.dirty_background_ratio — o kernel usa só um valor de cada par (o outro aparece como 0).
# 256 MB: a partir daqui quem escreve espera o disco (no NVMe ~0,1 s; num pendrive, segundos —
# não minutos).
vm.dirty_bytes = 268435456
# 64 MB (precisa ser menor que o de cima): a gravação em segundo plano começa cedo, em lotes
# pequenos, e o disco nunca recebe uma avalanche de uma vez.
vm.dirty_background_bytes = 67108864
