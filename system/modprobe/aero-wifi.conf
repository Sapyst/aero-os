# Aero: Realtek RTL8852CE Wi-Fi + Bluetooth combo (driver rtw89).
# Wi-Fi and Bluetooth share one radio and the firmware switches between them every few ms. With PCIe
# power saving (ASPM L1/L1.x) the link to the card sleeps between packets and wakes late, so the
# switching misses its slots: Bluetooth audio crackles, Wi-Fi slows or drops. Off for THIS card only
# (SSD and GPU keep their power saving); it costs a few tenths of a watt.
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y

# Country for the radio rules (wireless-regdb). Without it Linux uses the strict "world" rules:
# no 6 GHz at all and a limited 5 GHz. Change US to your country code.
options cfg80211 ieee80211_regdom=US
