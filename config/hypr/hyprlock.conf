# Tela de bloqueio (hyprlock) — doc 25. Super+L trava; a senha é a sua de sempre.
# Visual: a própria tela desfocada atrás, relógio grande e o campo de senha numa pílula de vidro
# (mesmo branco 80% da barra).

general {
    hide_cursor = true
    grace = 0                 # segundos em que mexer o mouse destrava sem senha (0 = nunca)
}

background {
    monitor =
    path = screenshot         # foto da tela no momento de travar...
    blur_passes = 4           # ...bem desfocada
    blur_size = 8
    brightness = 0.75
}

label {                       # relógio
    monitor =
    text = $TIME
    font_family = Inter
    font_size = 110
    color = rgba(255, 255, 255, 0.95)
    shadow_passes = 2
    position = 0, 220
    halign = center
    valign = center
}

label {                       # data, em inglês (como o resto da tela)
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    font_family = Inter
    font_size = 22
    color = rgba(255, 255, 255, 0.85)
    shadow_passes = 2
    position = 0, 110
    halign = center
    valign = center
}

input-field {                 # campo de senha
    monitor =
    size = 320, 52
    rounding = -1             # -1 = pílula (totalmente redondo)
    outline_thickness = 0
    inner_color = rgba(246, 246, 246, 0.80)
    font_color = rgb(30, 30, 30)
    check_color = rgb(53, 132, 228)
    fail_color = rgb(224, 27, 36)
    placeholder_text = Password
    fail_text = Wrong password
    dots_size = 0.22
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
