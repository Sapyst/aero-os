# Aparência das janelas: vidro fosco, cantos arredondados, sem bordas.
# Gerado pelo app Settings (Appearance). O app reescreve este arquivo ao aplicar.
# (notas pessoais: doc 14)

general {
    border_size = 0          # sem bordas
    gaps_in = 6              # espaço entre janelas
    gaps_out = 12            # espaço entre janelas e a borda da tela
    # Ímã: ao arrastar uma janela flutuante, ela "gruda" nas bordas da tela e nas outras janelas (doc 25)
    snap {
        enabled = true
        window_gap = 12      # gruda quando chega a 12 px de outra janela
        monitor_gap = 40     # ...ou a 40 px da borda da tela / da barra (ímã forte: "trava" na barra, forçando passa)
        respect_gaps = true  # gruda deixando o espacinho (gaps) em vez de encostar; respeita a barra do topo
    }
    # Redimensionar puxando pela beirada/cantos da janela (mesmo sem borda visível)
    resize_on_border = true
    extend_border_grab_area = 12   # pixels "invisíveis" pra fora da janela que também pegam o arraste
    hover_icon_on_border = true    # o cursor muda pra setinha de redimensionar ao passar ali
}

decoration {
    rounding = 22            # cantos arredondados: 22 px em TUDO (janelas, central, menus, Dock, barra, notificações; doc 30)
    rounding_power = 2       # 2 = canto de CÍRCULO: a única curva que o Hyprland E os apps (CSS border-radius) desenham igual (doc 30)

    # Opacidade: 1.0 = sólido. Janela EM FOCO sempre sólida; só as sem foco ficam de vidro (doc 44).
    active_opacity = 1.0
    inactive_opacity = 0.6
    fullscreen_opacity = 1.0 # em tela cheia (vídeos, jogos), sempre sólido

    # Esmaecer (escurecer de leve) as janelas sem foco, pra destacar a que está em uso
    dim_inactive = true
    dim_strength = 0.15      # 0 = nada, 1 = preto. 0.15 = médio (ajuste em Settings → Appearance)

    # Vidro fosco: desfoca o que está atrás das partes transparentes
    blur {
        enabled = true
        size = 16            # raio do desfoque
        passes = 5           # quantas vezes desfoca (mais = mais "fosco", mais pesado)
        vibrancy = 0.25      # realça a cor do fundo, efeito "vidro colorido"
        noise = 0.03         # granulado sutil, como vidro jateado
        brightness = 1.0     # padrão do Hyprland é 0.82: escurece o fundo (vidro "fumê")
        contrast = 1.0       # padrão 0.89; 1.0 = cores do fundo sem lavar
        popups = true        # menus e popups também
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
}

# Janelas em MOSAICO por padrão (regra do Aero): só flutuam com Super+V. Diálogos o Hyprland já solta sozinho;
# as janelinhas do próprio shell (Super Menu, Clipboard, Emojis...) têm regra própria no hyprland.conf.

# Jogos e vídeo: sempre sólidos (transparência atrapalharia)
windowrule = opaque on, match:class steam_app_.*
windowrule = opaque on, match:class gamescope
windowrule = opaque on, match:class mpv

# Vidro também na barra, no Super Menu e nas notificações
# ignore_alpha = só desfoca onde a camada é pelo menos 30% visível (evita borrão nas bordas)
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.3, match:namespace wofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace notifications
# Animação própria de cada camada (doc 25): notificações deslizam da direita (macOS),
# Alt+Tab "cresce" de leve do centro, janelinhas da barra e o aviso de volume só esmaecem
layerrule = animation slide right, match:namespace notifications
layerrule = animation slide right, match:namespace screen-record
layerrule = animation popin 92%, match:namespace alttab
layerrule = animation fade, match:namespace (som|central-notificacoes|osd|bandeja)

# "Sempre visível" (4ª bolinha, azul, na barra de título; ou Super+O): janela com a etiqueta
# "sempre-visivel" não esmaece e fica sólida mesmo sem foco. "override" = ignora as opacidades gerais.
windowrule = no_dim on, match:tag sempre-visivel
windowrule = opacity 1.0 override 1.0 override, match:tag sempre-visivel

# >>> animações (gerado pelo Settings → Appearance → Motion; não editar à mão)
animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    bezier = mola, 0.34, 1.4, 0.64, 1
    animation = windowsIn, 1, 4, mola, popin 85%
    animation = windowsOut, 1, 3, suave, popin 90%
    animation = windowsMove, 1, 4, suave
    animation = fade, 1, 3, suave
    animation = layersIn, 1, 3, suave, fade
    animation = layersOut, 1, 2, suave, fade
    animation = workspaces, 1, 5, suave, slidefade 15%
    animation = specialWorkspace, 1, 4, suave, slidevert
    animation = border, 0
}
# <<< animações
