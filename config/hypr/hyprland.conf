# GPUs: AMD (iGPU) desenha a interface; NVIDIA só entrega a imagem no HDMI
# e roda jogos/IA quando pedido. O primeiro da lista é o principal.
env = AQ_DRM_DEVICES,/dev/dri/amd-igpu:/dev/dri/nvidia-dgpu
env = LIBVA_DRIVER_NAME,radeonsi
# Apps GTK4 (Settings, Super Menu, bandeja, Alt+Tab...) desenham com OpenGL ("ngl").
# O padrão do GTK 4.24 é Vulkan, mas aqui só existe o Vulkan da NVIDIA (falta o pacote
# vulkan-radeon), então eles iam todos pra placa NVIDIA. Com "gl" (antes chamado "ngl") vão pra AMD, como o
# Firefox e os apps Electron. (notas pessoais)
env = GSK_RENDERER,gl
# Desfoque SEM quadrados (doc 39): apps GTK4 NÃO pedem desfoque por conta própria (protocolo
# ext-background-effect). Quando pediam, o Hyprland desfocava o RETÂNGULO que o app mandava, e em
# menus/popups aparecia um quadrado atrás dos cantos redondos. Sem o pedido, o Hyprland desfoca as
# janelas do jeito dele, seguindo a curva (igual Firefox e Discord), e as camadas não ganham desfoque.
env = GDK_WAYLAND_DISABLE,ext_background_effect_manager_v1

# Monitores: gerados pelo app Configurações (Super+I) em monitores.conf.
# A tela do laptop é ajustada pelo script hypr-lid (modo salvo em painel.conf).
source = ~/.config/hypr/monitores.conf
# Regra da tela do laptop que o hypr-lid escolheu (tampa fechada = apagada). Vem DEPOIS do
# monitores.conf pra valer sobre ele: assim o reload não liga e desliga a tela do laptop à toa.
source = ~/.config/hypr/tampa.conf
$mod = SUPER
bind = $mod, Q, exec, kitty
bind = $mod, R, exec, ~/.local/bin/supermenu
# Só o Super (apertar e soltar sozinho) abre o menu, tipo o Iniciar. Apertar de novo fecha.
bindr = $mod, SUPER_L, exec, ~/.local/bin/supermenu
bind = $mod, E, exec, ~/.local/bin/ez-fm          # gerenciador de arquivos (EZ File Manager, doc 43)
# Volume INTERNO do TerMusic/YTMusic (não mexe no do sistema): Super + / Super −, no teclado
# numérico ou nas teclas = e − ao lado do Backspace. Segurar repete.
binde = $mod, KP_Add, exec, ~/.local/bin/termusic-vol +5
binde = $mod, equal, exec, ~/.local/bin/termusic-vol +5
binde = $mod, plus, exec, ~/.local/bin/termusic-vol +5
binde = $mod, KP_Subtract, exec, ~/.local/bin/termusic-vol -5
binde = $mod, minus, exec, ~/.local/bin/termusic-vol -5
bind = $mod, I, exec, ~/.local/bin/configuracoes
bind = , Print, exec, ~/.local/bin/print-area
bind = $mod SHIFT, S, exec, ~/.local/bin/print-area           # recorte (o atalho do Windows)
bind = SHIFT, Print, exec, ~/.local/bin/print-area tela       # tela inteira
bind = ALT, Print, exec, ~/.local/bin/print-area janela       # só a janela ativa
bind = $mod, C, killactive
bind = $mod SHIFT, E, exec, ~/.local/bin/energia logout   # pergunta antes de sair (antes saía na hora!)
# Portais (compartilhar tela no Discord/OBS/Firefox...) sempre ligados à sessão ATUAL (doc 38)
exec-once = ~/.local/bin/hypr-portais
exec-once = waybar
exec-once = mako
exec-once = ~/.local/bin/papel-de-parede
exec-once = ~/.local/bin/hypr-layout-notify

# Steam inicia sozinha, minimizada na bandeja (-silent); janelas de news/popup abrem flutuando pela regra mais abaixo
exec-once = sleep 5 && steam -silent -cef-disable-gpu-compositing

# Teclado: ABNT2 (padrão) + US. Alterna com Super + Espaço
input {
    kb_layout = br,us
    kb_variant = abnt2,
    kb_options = grp:win_space_toggle
    # Foco só ao CLICAR (como no Windows). Passar o mouse por cima não rouba o teclado;
    # a rolagem do mouse continua funcionando na janela que está embaixo do cursor.
    follow_mouse = 2
    # Passar o mouse de uma janela flutuante pra outra também não troca o foco
    float_switch_override_focus = 0
}
# Touchpad, gestos e mouse: gerado pelo Settings → Mouse & Touchpad (doc 23)
source = ~/.config/hypr/entrada.conf

# Janelas
# Super+←/→ como no Windows: flutuante vai pra metade da tela; em mosaico troca de lado (doc 25)
bind = $mod, left, exec, ~/.local/bin/hypr-encaixar left
bind = $mod, right, exec, ~/.local/bin/hypr-encaixar right
# mudar o foco pelas setas agora é Super+Alt+←/→
bind = $mod ALT, left, movefocus, l
bind = $mod ALT, right, movefocus, r
bind = $mod, up, fullscreen, 1                                           # Super+↑ maximiza/restaura (nativo; continua no mosaico)
# O botão maximizar dos próprios apps também usa o nosso maximizar (com folga, sem cobrir as flutuantes; doc 29)
# (desligado em 10/10/2026: ele trocava o maximizar nativo pelo "flutuante"; agora o nativo é o certo)
bind = $mod, down, exec, ~/.local/bin/hypr-minimizar      # Super+↓ minimiza (como no Windows)
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating

# Mouse: Super + arrastar com botão esquerdo move, com o direito redimensiona
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Áreas de trabalho
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Terminal: em mosaico como tudo (Super+V solta); quando flutuar, nasce no centro
windowrule = center on, match:class kitty

# Steam: todas as janelas (cliente, login, amigos, configurações, diálogos) flutuam e abrem centralizadas
# Seletor de arquivos do sistema (EZ File Manager em modo picker, doc 43): é um diálogo, então flutua
windowrule = float on, match:class ^ez-fm$, match:initial_title ^(Open File|Save File|Select Folder)$
windowrule = size (monitor_w*0.62) (monitor_h*0.72), match:class ^ez-fm$, match:initial_title ^(Open File|Save File|Select Folder)$
windowrule = center on, match:class ^ez-fm$, match:initial_title ^(Open File|Save File|Select Folder)$
windowrule = float on, match:class ^steam$, match:title negative:^Steam$     # só as janelinhas; o cliente fica em mosaico
windowrule = center on, match:class ^steam$, match:title negative:^notificationtoasts_.*_desktop$
# O Steam (X11) pede "maximizar" (botão □ ou clique duplo na barra dele), o Hyprland maximiza, mas não avisa
# o Steam; aí o "restaurar" do Steam não funciona e a janela fica presa: sem arrastar, sem redimensionar.
# Então o Hyprland ignora o pedido de maximizar do Steam. Pra maximizar, use o atalho do Hyprland.
windowrule = suppress_event maximize, match:class ^steam$

# Steam: notificações (toast "amigo X está jogando Y"). Flutuam soltas do canto (24 px de folga, no canto
# de baixo à direita), sem roubar foco, sempre visíveis, cantos arredondados e fundo sólido (force_rgbx ignora
# a transparência do toast). Estas regras vêm DEPOIS do "center" acima pra valerem sobre ele.
windowrule = move (monitor_w-window_w-24) (monitor_h-window_h-24), match:class ^steam$, match:title ^notificationtoasts_.*_desktop$
windowrule = no_focus on, match:class ^steam$, match:title ^notificationtoasts_.*_desktop$
windowrule = pin on, match:class ^steam$, match:title ^notificationtoasts_.*_desktop$
windowrule = rounding 22, match:class ^steam$, match:title ^notificationtoasts_.*_desktop$
windowrule = force_rgbx on, match:class ^steam$, match:title ^notificationtoasts_.*_desktop$

# Tampa do laptop: fechada + monitor externo = apaga a tela interna; aberta = volta a espelhar
# (o script fica em ~/.local/bin/hypr-lid)
bindl = , switch:on:Lid Switch, exec, ~/.local/bin/hypr-lid closed
bindl = , switch:off:Lid Switch, exec, ~/.local/bin/hypr-lid open
# "exec" (sem -once) roda a cada reload, pra tela interna sempre bater com a tampa
exec = ~/.local/bin/hypr-lid

# Agente de senha: janelinha quando um app pede permissão de administrador
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
# No boot o monitor externo pode aparecer um pouco depois; reajusta a tela do laptop
exec-once = sleep 3 && ~/.local/bin/hypr-lid

# App Configurações: em mosaico como tudo; quando flutuar (Super+V), no centro
windowrule = center on, match:class com.aero.Settings
# Janelinhas do PRÓPRIO shell: sempre flutuantes (são overlays — em mosaico quebrariam). Tudo o mais nasce em
# mosaico (aparencia.conf) e só flutua com Super+V.
windowrule = float on, match:class ^com\.aero\.(SuperMenu|Clipboard|Emojis|Power|TitlebarAuto|BarraAuto|PhotoPicker|DockTest|Settings\.AskPass)$
windowrule = float on, match:class ^termusic-widget$
windowrule = float on, match:class ^steam$, match:title ^notificationtoasts_.*_desktop$

# ---------- Aparência (doc 14) ----------
# Vidro fosco, cantos arredondados, sem bordas, janelas flutuantes
source = ~/.config/hypr/aparencia.conf
# Tema claro/escuro e filtro de luz azul pelo horário (confere a cada minuto)
exec-once = hyprsunset
exec-once = ~/.local/bin/hypr-tema --loop
# Minimizar: apps que têm botão próprio de minimizar também funcionam
exec-once = ~/.local/bin/hypr-frente   # a janela focada sempre vem pra frente (e janelas novas respeitam a barra)
# Janela solta acima da barra desce até o limite: quem cuida é o hypr-frente (vigia) + hypr-limite.
# (Um "bindrn = , mouse:272" não serve: o hyprbars engole o apertar e o soltar ao arrastar pela barra.)
exec-once = ~/.local/bin/hypr-minimizar-escuta
exec-once = ~/.local/bin/hypr-lembrar-tamanho   # lembra o tamanho da janela do Thunar (ele não consegue sozinho no Hyprland)
# Super+M: escolher uma janela minimizada pra trazer de volta
bind = $mod, M, exec, ~/.local/bin/hypr-minimizados
# Super+O: "sempre visível" na janela ativa (não esmaece sem foco). Útil em janelas sem a barra do sistema
bind = $mod, O, exec, ~/.local/bin/hypr-sempre-visivel
# Barras de título: cada app usa a SUA (doc 28). O plugin hyprbars não é mais carregado no login
# (antes: "exec-once = hyprpm reload -n"), e o hypr-barra-auto (que perguntava, pra cada app novo,
# se ele tinha barra própria) também saiu. Pra voltar com as barras: doc 28.
# O hyprbars.conf abaixo só diz "nenhuma janela tem barra do plugin": vale se alguém carregar o plugin
# à mão. Fica no bloco "noerror" porque, sem o plugin, a regra "hyprbars:..." daria erro (doc 27).
# hyprlang noerror true
source = ~/.config/hypr/hyprbars.conf
# hyprlang noerror false



# Super Menu (doc 16): carregado no login pra abrir na hora. É uma janela flutuante sem barra,
# centralizada logo abaixo da barra de cima, que desce de trás dela ao abrir.
exec-once = ~/.local/bin/supermenu --daemon
# Ele é uma CAMADA (não janela/app, doc 33): posição e cantos ficam no próprio programa. Aqui só a animação.
# "popin" (surge crescendo) e não "slide": o slide recorta a camada num retângulo enquanto desce, e os cantos
# redondos pareciam quadrados durante a animação (doc 37)
layerrule = animation popin 94%, match:namespace supermenu
# Janelinha OS/APP do hypr-barra-auto
windowrule = float on, match:class com\.aero\.TitlebarAuto
windowrule = center on, match:class com\.aero\.TitlebarAuto
windowrule = rounding 14, match:class com\.aero\.TitlebarAuto

# Bandeja do sistema própria (clique duplo abre, direito = menu; doc 17)
exec-once = ~/.local/bin/bandeja

# Papel de parede (doc 21): o hyprpaper desenha a imagem de ~/.config/hypr/hyprpaper.conf.
# Quem inicia o hyprpaper no login é o "exec-once = ~/.local/bin/papel-de-parede" lá em cima.
# Super+Shift+W: a imagem copiada (o "Copy Image" de qualquer navegador/app) vira papel de parede.
# Também: Ctrl+Shift+V → botão direito numa imagem → Set as Wallpaper; e o botão direito do Thunar.
bind = $mod SHIFT, W, exec, ~/.local/bin/papel-de-parede --clipboard
bind = $mod SHIFT, A, exec, ~/.local/bin/juntar-janelas 1   # junta todas as janelas na área 1

# Dock na base da tela (doc 24). Programa: ~/.local/share/aero-shell/dock.py; opções em Settings → Dock.
# É uma camada que não reserva espaço: as janelas não mudam. A animação é desenhada pelo próprio Dock.
# Parte do sistema: o lançador fica de olho e abre o Dock de novo se ele fechar. Apps: botão direito → Add App.
exec-once = ~/.local/bin/dock

# Widgets da área de trabalho (doc 51): relógio, sistema, recursos, clima, batalha Pokémon. Botão direito no
# desktop = menu. Vidro fosco (desfoque só onde o cartão é opaco: ignore_alpha) e surgir/sumir suave.
exec-once = ~/.local/bin/widgets
layerrule = blur on, match:namespace aero-widget
layerrule = ignore_alpha 0.2, match:namespace aero-widget
layerrule = animation popin 92%, match:namespace aero-widget

# Alt+Tab estilo Windows (doc 20). Programa: ~/.local/share/aero-shell/alttab.py
# (substitui o hyprshell: ele falhava ao trocar de janela nesta versão do Hyprland)
exec-once = ~/.local/bin/alttab --daemon
bind = ALT, Tab, exec, ~/.local/bin/alttab next
bind = ALT SHIFT, Tab, exec, ~/.local/bin/alttab prev
# Soltar o Alt = confirma a troca. Quem vê isso é o Hyprland (o teclado de verdade); a lista do
# Alt+Tab às vezes achava que o Alt estava solto e trocava logo no 1º Tab.
bindrt = ALT, Alt_L, exec, ~/.local/bin/alttab confirm
bindrt = ALT, Alt_R, exec, ~/.local/bin/alttab confirm
bind = $mod, Tab, exec, ~/.local/bin/alttab overview     # visão geral de todas as janelas (doc 25)
# Soltar o Alt, setas, Enter e Esc: a própria lista vigia o teclado enquanto está aberta.
# (Um "bindr = ALT, Alt_L" não serve: o Hyprland cancela o "ao soltar" se o Tab foi apertado no meio.)

# Trocar de janela pelo teclado (Alt+Tab) não arrasta o cursor do mouse pro meio da janela
cursor {
    no_warps = true
}

# Histórico da área de transferência (doc 22)
# wl-paste --watch roda o clipboard-guardar a cada cópia (guarda texto, imagem, arquivos; até 50)
exec-once = wl-paste --watch ~/.local/bin/clipboard-guardar
exec-once = ~/.local/bin/clipboard --daemon
bind = CTRL SHIFT, V, exec, ~/.local/bin/clipboard
windowrule = size 520 640, match:class com\.aero\.Clipboard
windowrule = center on, match:class com\.aero\.Clipboard
windowrule = rounding 22, match:class com\.aero\.Clipboard
windowrule = animation popin 90%, match:class com\.aero\.Clipboard

# Atalhos de costume do Windows (doc 23)
bind = ALT, F4, killactive                                   # fecha a janela
bind = $mod, D, exec, ~/.local/bin/hypr-area-de-trabalho     # mostra a área de trabalho / traz tudo de volta
bind = $mod, period, exec, ~/.local/bin/emojis               # emojis (Super + ponto)
windowrule = center on, match:class com\.aero\.(Power|Emojis)
windowrule = no_shadow on, match:class com\.aero\.Emojis
windowrule = no_blur on, match:class com\.aero\.Emojis
windowrule = no_anim on, match:class com\.aero\.Emojis

# Teclas de volume, brilho e mídia + aviso na tela (doc 23). Programa: ~/.local/share/aero-shell/som.py
# bindel: "e" = repete segurando a tecla; "l" = funciona até com a tela bloqueada
exec-once = ~/.local/bin/som --daemon
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.local/bin/som osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.local/bin/som osd volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.local/bin/som osd volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && ~/.local/bin/som osd mic
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/brilho +5
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/brilho -5
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Tela de bloqueio e inatividade (doc 24). hyprlock/hypridle: sudo pacman -S hyprlock hypridle
# (sem eles instalados, o Super+L só avisa como instalar)
bind = $mod, L, exec, ~/.local/bin/travar
exec-once = command -v hypridle >/dev/null && hypridle

# Cursor (doc 25): tema e tamanho escolhidos em Settings → Appearance (CURSOR_TEMA/CURSOR_TAM no painel.conf)
exec-once = bash -c '. ~/.local/share/aero-shell/painel.sh && ler_painel; hyprctl setcursor "${CURSOR_TEMA:-Adwaita}" "${CURSOR_TAM:-24}"'

# Menu da barra de título (doc 26): o hyprbars "engole" qualquer clique em cima da barra, então um
# atalho de clique direito aqui nunca recebe nada. Fica pendente uma versão do plugin com clique direito.

# Vigia de cliques (doc 33): faz o "–" e o "□" dos PRÓPRIOS APPS funcionarem (o Hyprland 0.56 ignora o
# pedido deles) e fecha as janelinhas (central, Super Menu...) ao clicar fora.
# "bindn" = o clique continua indo pro app normalmente. socat manda só uma palavra pro vigia (rápido).
exec-once = ~/.local/bin/hypr-botoes --daemon
bindn = , mouse:272, exec, echo clique | socat - UNIX-SENDTO:$XDG_RUNTIME_DIR/hypr-botoes.sock

# TerMusic (YouTube Music no terminal) e YTMusic (app): ~/.local/bin/termusic, ~/.local/bin/ytmusic
windowrule = size 1280 760, match:class ^termusic$
windowrule = size 1240 820, match:class ^com\.aero\.YTMusic$
# widget: pequeno, fixo em todas as áreas de trabalho, no canto de baixo à direita (acima da Dock)
windowrule = size 600 240, match:class ^termusic-widget$
windowrule = pin on, match:class ^termusic-widget$
windowrule = move (monitor_w-window_w-24) (monitor_h-window_h-96), match:class ^termusic-widget$
