# Gerado pelo Settings → Mouse & Touchpad (sec_mouse.py). Não editar à mão: é reescrito.
input {
    sensitivity = 0      # velocidade do mouse (-1 a 1)
    accel_profile = adaptive      # adaptive = acelera com o movimento rápido; flat = sempre igual (jogos)
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, ~/.local/bin/supermenu
gesture = 4, down, dispatcher, exec, ~/.local/bin/hypr-minimizar
