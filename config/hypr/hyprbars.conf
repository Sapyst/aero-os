# Barras de título (plugin hyprbars) — doc 31/35.
# Regra: cada app usa a PRÓPRIA barra (Firefox, Discord, apps GTK...). Exceções, que não têm barra
# própria e ganham a nossa: o TERMINAL (kitty) e o Thunar (arquivos), com bolinhas de fechar / minimizar /
# maximizar / sempre visível.
plugin {
    hyprbars {
        bar_height = 32
        bar_color = rgba(242424e6)   # (o tema atual sobrescreve em tema-atual.conf)
        col.text = rgba(ffffffdd)
        bar_text_size = 11
        bar_text_font = Inter
        bar_text_align = center
        bar_buttons_alignment = left    # botões do lado esquerdo
        bar_padding = 14
        bar_button_padding = 8
        bar_blur = false                # sem desfoque: o plugin desfoca um RETÂNGULO (quadrado atrás do canto curvo); a barra é sólida
        bar_part_of_window = true       # a barra conta como parte da janela (cantos arredondados juntos)
        bar_precedence_over_border = true
        on_double_click = ~/.local/bin/hypr-barra maximizar   # clique duplo = maximizar/restaurar
        # os botões (✕ ▲ ▼ ●) vêm do tema-atual.conf, gerado pelo hypr-tema na cor do tema (doc 42)
    }
}
# todo mundo SEM a nossa barra, menos o terminal
windowrule = hyprbars:no_bar on, match:class negative:^(kitty|[Tt]hunar)$
source = ~/.config/hypr/tema-atual.conf   # cores do tema atual (o hypr-tema escreve; sem isso um reload voltava a barra escura)
# Thunar: janela 100% opaca pro Hyprland (a transparência do Hyprland também deixava a NOSSA barra
# translúcida, e o texto da janela de trás aparecia nela). O vidro do Thunar continua: vem da cor
# semitransparente do próprio tema GTK3 (cores-tema.css), que o Hyprland desfoca.
windowrule = opacity 1.0 override 1.0 override, match:class ^([Tt]hunar)$
