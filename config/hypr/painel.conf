COR_SINC=1
ESMAECER=0.15
COR_CLARA_MANUAL=f6f6f6
COR_ESCURA_MANUAL=1e1e1e
WALL_CORES=0
DOCK_MODO=inteligente
DOCK_ABERTOS=1
