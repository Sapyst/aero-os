# Sempre abrir com este tamanho (não lembrar o último)
remember_window_size no
initial_window_width 1000
initial_window_height 600

# Visual combinando com o sistema (doc 25)
font_family      Adwaita Mono
font_size        11.5
# respiro entre o texto e a borda (o kitty não aceita comentário na mesma linha do valor)
window_padding_width 10
cursor_shape     beam
cursor_blink_interval 0.6
# Tema claro/escuro AUTOMÁTICO: o kitty lê o claro/escuro do sistema (o mesmo que o hypr-tema troca)
# e usa light-theme.auto.conf ou dark-theme.auto.conf, que ficam nesta mesma pasta.
# A transparência fica por conta do Hyprland (vidro); aqui o fundo é sólido pra não somar as duas.
