# cava do TerMusic (painel de cima à direita): degradê neutro, cores do tema (o lançador termusic reescreve)
[general]
framerate = 60
bar_width = 2
bar_spacing = 1
[input]
method = pulse
source = auto
[output]
method = ncurses
[color]
gradient = 1
gradient_count = 3
gradient_color_1 = '#5d5d5d'
gradient_color_2 = '#a6a6a6'
gradient_color_3 = '#f0f0f0'
[smoothing]
noise_reduction = 77
