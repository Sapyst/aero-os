# DotStyle — OLED black, dots everywhere, one red accent. Loaded AFTER aparencia.conf (source in
# hyprland.conf), so only what is here changes. Written by aero-visual (Settings -> Theme -> Visual).

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = false
    blur {
        size = 6
        passes = 3
        vibrancy = 0.0
        noise = 0.0
        brightness = 0.9
        contrast = 1.0
    }
    shadow {
        enabled = false
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ecebe855)
    col.inactive_border = rgba(ecebe812)
}

animations {
    enabled = true
    # a quick, precise feel: things snap into place with a tiny overshoot, like a dot popping in
    bezier = ponto, 0.34, 1.36, 0.64, 1
    bezier = saida, 0.4, 0, 0.6, 0.2
    bezier = liso, 0.25, 0.1, 0.25, 1
    animation = windowsIn, 1, 4, ponto, popin 88%
    animation = windowsOut, 1, 3, saida, popin 90%
    animation = windowsMove, 1, 4, liso, slide
    animation = fade, 1, 3, liso
    animation = layersIn, 1, 3, ponto, popin 92%
    animation = layersOut, 1, 2, saida, fade
    animation = workspaces, 1, 4, liso, fade
    animation = specialWorkspace, 1, 4, liso, slidevert
    animation = border, 1, 6, liso
}
