# Solid — formas chapadas, sólidas (Pixel / Material You). Carregado DEPOIS do aparencia.conf (source em
# hyprland.conf), então só o que está aqui muda. Quem escreve este arquivo: aero-visual (Settings -> Theme).
# Sem contornos, sem vidro: as janelas são superfícies tonais; o raio é o do sistema (RAIO_CANTOS,
# reaplicado pelo aero-visual em cima do "rounding" abaixo).

decoration {
    rounding = 24
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 28
        render_power = 3
        offset = 0 6
        color = rgba(00000038)
        color_inactive = rgba(00000020)
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
}

animations {
    enabled = true
    # o "emphasized" do Material 3: sai rápido e assenta macio; a saída acelera e some
    bezier = enfatizado, 0.05, 0.7, 0.1, 1
    bezier = acelera, 0.3, 0, 0.8, 0.15
    bezier = padrao, 0.2, 0, 0, 1
    animation = windowsIn, 1, 4.5, enfatizado, popin 86%
    animation = windowsOut, 1, 2.5, acelera, popin 92%
    animation = windowsMove, 1, 4.5, enfatizado, slide
    animation = fade, 1, 3, padrao
    animation = layersIn, 1, 4, enfatizado, popin 90%
    animation = layersOut, 1, 2.5, acelera, fade
    animation = workspaces, 1, 4.5, enfatizado, slide
    animation = specialWorkspace, 1, 4, enfatizado, slidevert
    animation = border, 0
}
