# AerOS — visual claro, vidro pastel, movimento fluido (inspirado no trailer do "Nava OS").
# Carregado DEPOIS do aparencia.conf (source em hyprland.conf), então só o que está aqui muda.
# Quem escreve este arquivo: aero-visual (Settings → Theme → Overview → Visual).

decoration {
    rounding = 18
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.97
    blur {
        size = 14
        passes = 4
        vibrancy = 0.18
        noise = 0.008
        brightness = 1.04
        contrast = 0.96
    }
    shadow {
        enabled = true
        range = 42
        render_power = 4
        offset = 0 12
        color = rgba(5b4fa024)
        color_inactive = rgba(5b4fa014)
    }
}

general {
    gaps_in = 8
    gaps_out = 16
}

animations {
    enabled = true
    # ease-out-quint: chega rápido e pousa devagar, sem quicar — a "calma" do vídeo
    bezier = calmo, 0.22, 1, 0.36, 1
    bezier = saida, 0.4, 0, 0.6, 0.2
    bezier = macio, 0.25, 0.1, 0.25, 1
    animation = windowsIn, 1, 5, calmo, popin 92%
    animation = windowsOut, 1, 3, saida, popin 94%
    animation = windowsMove, 1, 6, calmo, slide
    animation = fade, 1, 4, macio
    animation = fadeLayersIn, 1, 4, calmo
    animation = layersIn, 1, 5, calmo, slide
    animation = layersOut, 1, 3, saida, fade
    animation = workspaces, 1, 6, calmo, slide
    animation = specialWorkspace, 1, 5, calmo, slidevert
    animation = border, 0
}

# Command Bar (Super+Espaço) e troca de layout do teclado em Super+Shift+Espaço — só no AerOS
input {
    kb_options =
}
bind = SUPER, space, exec, ~/.local/bin/comando
bind = SUPER SHIFT, space, exec, hyprctl switchxkblayout all next
layerrule = blur on, match:namespace aero-comando
layerrule = ignore_alpha 0.3, match:namespace aero-comando
layerrule = animation popin 96%, match:namespace aero-comando
