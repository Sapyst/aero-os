[package]
name = "aero-sessiond"
version = "0.1.0"
edition = "2024"
description = "Daemon unificado de sessão do Aero OS: energia inteligente (bateria), taxa de atualização adaptativa (taxa) e vigia de ícones (icones --watch)"

[dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", features = ["blocking-api"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
