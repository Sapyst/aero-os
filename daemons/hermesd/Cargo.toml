[package]
name = "hermesd"
version = "0.1.0"
edition = "2024"
description = "Daemon nativo do Hermes (org.freedesktop.Notifications + com.aero.Hermes) e dados da Hestia (áudio, Bluetooth, rede) em Rust para o Aero OS"

[dependencies]
libc = "0.2"
png = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", features = ["blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
